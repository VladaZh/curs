services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booking -d identity" ]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  catalog:
    build: ./catalog_service
    environment:
      CATALOG_DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/catalog
      CATALOG_RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      CATALOG_REDIS_URL: redis://redis:6379/0
      CATALOG_JWT_SECRET: dev-secret
    ports:
      - "88:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  booking:
    build: ./booking_service
    environment:
      BOOKING_DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/booking
      BOOKING_RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      BOOKING_JWT_SECRET: dev-secret
    ports:
      - "888:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity:
    build: ./identity_service
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/identity
      IDENTITY_RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      IDENTITY_JWT_SECRET: dev-secret
      IDENTITY_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      IDENTITY_BOOTSTRAP_ADMIN_PASSWORD: admin12345
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  notification:
    build: ./notification_service
    environment:
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/notification
      NOTIFICATION_RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      NOTIFICATION_JWT_SECRET: dev-secret
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: "1025"
      NOTIFICATION_SMTP_STARTTLS: "false"
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started