resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.themealdb.com; connect-src 'self' https://www.themealdb.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/identity/ {
        set $upstream http://identity:8000;
        rewrite ^/api/identity/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /api/catalog/ {
        set $upstream http://catalog:8000;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
    location /api/booking/ {
        set $upstream http://booking:8000;
        rewrite ^/api/booking/(.*)$ /$1 break;
        proxy_pass $upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}